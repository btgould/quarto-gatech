title: Gatech
author: Brendan Gould
version: 1.0.0
quarto-required: ">=1.7.0"
contributes:
  formats:
    revealjs:
      width: 1920
      height: 1080
      max-scale: 5
      filters:
        - bg.lua
        - per-slide-refs.lua
        - at: pre-ast
          path: theorems.lua
        - at: post-render
          path: theorems.lua
      theme: [custom.scss]
      citations-hover: true
      citation-location: document
      csl: ieee.csl
      title-slide-attributes:
        data-background-image: assets/background_title.png
        data-background-size: contain
      slide-number: c/t
      incremental: false
